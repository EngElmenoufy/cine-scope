<section class="relative mt-[72px] min-h-120 h-[90vh] py-10">
  <!-- @if (isLoading()) { -->
  <!-- <app-hero-loading /> -->
  <!-- }@else if (currentMovie()) { -->
  @if (currentMovie()) {
  <div class="my-container flex flex-col h-full justify-end">
    <!-- <img [src]="backdropImageUrl()" [alt]="currentMovie().title" class="absolute inset-0 w-full h-full object-cover" /> -->
    <img [src]="backdropImageUrl()"
      class="absolute bg-muted-light inset-0 w-full h-full object-cover object-center hero-bg"
      [class.opacity-0]="!isImageLoaded()" [class.opacity-100]="isImageLoaded()" (load)="isImageLoaded.set(true)"
      [alt]="currentMovie()?.name" />
    <!-- <div class="absolute inset-0 bg-black/60"></div> -->
    <div class="overlay"></div>

    <div class="relative z-10 max-w-120 mb-6">
      <div class="text-sm md:text-base centered-vertical mb-2 gap-4 flex-wrap">
        <span class="px-3 py-0.5 bg-primary rounded-lg uppercase tracking-wide text-primary-dark">Upcoming</span>
        <span>{{ currentMovie()?.release_date | date:'MMM d'}}</span>
        <div class="centered-vertical gap-1">
          <app-icon name="star" width="1.2rem" height="1.2rem" color="#f5a623" />
          <span>{{ currentMovie()?.vote_average | number:'1.1-1' }}</span>
        </div>
      </div>

      <h2 class="text-4xl sm:text-5xl md:text-7xl header font-extrabold mb-6">{{ currentMovie()?.title }}</h2>
      <p class="text-muted-light text-sm md:text-base font-medium line-clamp-3">{{ currentMovie()?.overview }}</p>

      <div class="mt-8 centered-vertical gap-4">
        <app-button bgColor="#f5a623" bgColorHover="#d98d12" borderRadius="0.5rem"
          otherClasses="centered-vertical text-sm md:text-base" textColor="#0a0a10" textColorHover="#0a0a10"
          paddingX="2rem" paddingY="0.5rem">
          <app-icon name="play" width="1rem" height="1rem" />
          <span class="ml-2">Watch Trailer</span>
        </app-button>

        <app-button bgColor="#ffffff30" bgColorHover="#ffffff40" borderRadius="0.5rem"
          otherClasses="centered-vertical text-sm md:text-base" textColor="#f0eeea" textColorHover="#f0eeea"
          paddingX="2rem" paddingY="0.5rem">
          <app-icon name="info" width="1.25rem" height="1.25rem" color="#f0eeea" />
          <span class="ml-2">More Info</span>
        </app-button>
      </div>
    </div>

    <div class="relative z-10 self-center md:self-end centered-vertical gap-1.5">
      @for(item of upcomingMovies(); track $index){
      <button class="bg-muted w-2 h-2 rounded-full btn cursor-pointer" [class.btn-active]="$index === currentIndex()"
        (click)="goTo($index)"></button>
      }
    </div>

  </div>
  }
</section>
