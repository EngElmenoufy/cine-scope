<app-explore-content label="Trending now">
  <app-slider [isCentered]="false" class="block my-10">
    @if (isLoading()) {
    @for (item of [1,2,3,4,5,6]; track $index) {
    <app-card-loading />
    }
    }@else {
    @for (item of trendingAll(); track item.id) {
    <app-card [data]="item" />
    }
    }
  </app-slider>
</app-explore-content>
